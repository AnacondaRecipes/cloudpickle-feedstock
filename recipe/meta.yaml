{% set name = "cloudpickle" %}
{% set version = "3.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/cloudpipe/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 7acae4307459d436eee740eea52ec9056f37b8b907d6aef7b0a97a1ccff90ff9

build:
  number: 1
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python
    - pip
    # flit-core 4.x breaks this build; cap below 4 (PKG-18867).
    - flit-core <4
  run:
    - python

{% set deselect_test = " --deselect=tests/cloudpickle_file_test.py::CloudPickleFileTests::test_pickling_special_file_handles" %}
{% set deselect_test = deselect_test + " --deselect=tests/cloudpickle_test.py::CloudPickleTest::test_pickling_file_handles" %}
{% set deselect_test = deselect_test + " --deselect=tests/cloudpickle_test.py::Protocol2CloudPickleTest::test_pickling_file_handles" %}

test:
  source_files:
    - tests
  imports:
    - cloudpickle
  requires:
    - pip
    # pkgs/main has no py3.15 psutil (newest build is py314). Test-only;
    # used solely by test_interactive_remote_function_calls_no_memory_leak.
    - psutil  # [py<315]
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # tests/testutils.py imports psutil at module scope, so collection fails
    # without it. Delay that import; the memory-leak test still needs psutil.
    - python -c "from pathlib import Path; p=Path('tests/testutils.py'); t=p.read_text(); old=chr(10)+'import psutil'+chr(10); needle='        return psutil.Process'; assert old in t and needle in t; t=t.replace(old, chr(10), 1); p.write_text(t.replace(needle, '        import psutil'+chr(10)+needle, 1))"  # [py>=315]
    - pytest -v tests {{ deselect_test }} -k "not test_interactive_remote_function_calls_no_memory_leak"  # [py>=315]
    - pytest -v tests {{ deselect_test }}  # [py<315]

about:
  home: https://github.com/cloudpipe/cloudpickle
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Extended pickling support for Python objects
  description: |
    cloudpickle is extended pickling support for Python objects.
    cloudpickle makes it possible to serialize Python constructs not
    supported by the default pickle module from the Python standard library.
  doc_url: https://github.com/cloudpipe/cloudpickle/blob/master/README.md
  dev_url: https://github.com/cloudpipe/cloudpickle

extra:
  recipe-maintainers:
    - jakirkham
    - ogrisel
    - rgbkrk
    - mrocklin
    - nehaljwani
